<div class="selection-layout" *ngIf="currentTask">
  <div class="selection-card">
    <header class="card-header">
      <button class="back-link" (click)="goBack()"><span class="icon">⬅</span> Back</button>
      <h1>{{ currentTask.title }}</h1>
      <p class="instruction-text">{{ currentTask.instruction }}</p>
    </header>

    <div class="options-container">
      <div
        *ngFor="let option of currentTask.options"
        class="option-row"
        [class.selected]="isSelected(option.id)"
        (click)="toggleSelection(option.id)"
      >
        <div class="checkbox-wrapper">
          <div class="custom-checkbox">
            <span *ngIf="isSelected(option.id)">✓</span>
          </div>
        </div>
        <div class="option-content">
          <span class="option-number">{{ option.id }}.</span>
          <span class="option-text">{{ option.text }}</span>
        </div>
      </div>
    </div>

    <footer class="card-footer">
      <div class="status-bar">
        <div class="progress-label">
          Selected: <strong>{{ selectedIds.length }}</strong> / {{ currentTask.requiredCount }}
        </div>
        <div class="progress-track">
          <div
            class="progress-fill"
            [style.width.%]="(selectedIds.length / currentTask.requiredCount) * 100"
          ></div>
        </div>
      </div>

      <button
        class="submit-btn"
        [disabled]="selectedIds.length !== currentTask.requiredCount"
        (click)="submitSelection()"
      >
        Submit Selection
      </button>
    </footer>
  </div>
</div>
