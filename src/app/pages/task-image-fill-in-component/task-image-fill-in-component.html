<div class="task-layout" *ngIf="currentTask">
  <header class="task-header">
    <button class="back-btn" (click)="goBack()">⬅ Back</button>
    <h2>{{ currentTask.title }}</h2>
    <p [innerHTML]="currentTask.instruction"></p>
  </header>

  <div class="task-container">
    <div class="image-grid">
      <div class="image-card" *ngFor="let item of currentTask.images; let i = index">
        <div class="image-wrapper">
          <img [src]="item.imageSrc" alt="Body System {{ item.id }}" class="system-image" />
        </div>
        <div class="input-section">
          <div class="input-row">
            <span class="item-number">{{ item.id }}.</span>
            <input
              type="text"
              class="fill-in-input"
              [(ngModel)]="userAnswers[i]"
              [disabled]="isGrading || isEvaluated"
              placeholder="System name..."
              [class.correct-border]="gradingResults?.[i]?.status === 'correct'"
              [class.partial-border]="gradingResults?.[i]?.status === 'partial'"
              [class.incorrect-border]="gradingResults?.[i]?.status === 'incorrect'"
            />
          </div>

          <div class="feedback-box" *ngIf="gradingResults" [ngClass]="gradingResults[i].status">
            <span class="icon">{{
              gradingResults[i].status === 'correct'
                ? '✅'
                : gradingResults[i].status === 'partial'
                  ? '⚠️'
                  : '❌'
            }}</span>
            <span class="feedback-text">{{ gradingResults[i].feedback }}</span>
          </div>

          <div
            class="correct-hint"
            *ngIf="showAnswers && gradingResults?.[i]?.status !== 'correct'"
            style="
              color: #10b981;
              font-weight: bold;
              margin-top: 12px;
              font-size: 0.9rem;
              text-align: center;
            "
          >
            💡 Ideal answer: {{ item.correctAnswer }}
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="action-footer">
    <button
      *ngIf="!isEvaluated"
      class="submit-btn ai-btn"
      (click)="submitTask()"
      [disabled]="isGrading || !isAllAnswered()"
    >
      {{ isGrading ? '🤖 AI is analyzing...' : 'Evaluate with AI 🤖' }}
    </button>

    <div
      *ngIf="isEvaluated"
      class="result-summary"
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        background: #f8fafc;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #e2e8f0;
        width: 100%;
        max-width: 600px;
        margin: 0 auto;
      "
    >
      <h3 style="margin: 0; color: #1e293b">
        Your Score: {{ score }} / {{ currentTask.images.length }}
      </h3>

      <div style="display: flex; gap: 12px">
        <button
          class="submit-btn"
          style="background: #ef4444; padding: 10px 20px"
          (click)="retryTask()"
        >
          Try Again 🔄
        </button>
        <button
          class="submit-btn"
          style="background: #3b82f6; padding: 10px 20px"
          (click)="toggleAnswers()"
        >
          {{ showAnswers ? 'Hide Ideal Answers 🙈' : 'Show Ideal Answers 💡' }}
        </button>
      </div>
    </div>
  </footer>
</div>
