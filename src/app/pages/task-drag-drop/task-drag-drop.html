<div class="task-layout" *ngIf="currentTask">
  <header class="task-header">
    <button class="back-btn" (click)="goBack()">⬅ Vissza</button>
    <h2>{{ currentTask.title }}</h2>
    <p [innerHTML]="currentTask.instruction"></p>
  </header>

  <div class="visual-drop-container" *ngIf="currentTask.type === 'list-to-image'">
    <div class="list-container source-list">
      <h3>Kifejezések</h3>
      <div
        cdkDropList
        id="availableList"
        [cdkDropListData]="availableOptions"
        [cdkDropListConnectedTo]="zoneLists"
        class="item-list"
      >
        <div class="item-box" *ngFor="let item of availableOptions" cdkDrag [cdkDragData]="item">
          {{ item }}
        </div>
      </div>
    </div>

    <div class="image-map-container">
      <img [src]="currentTask.imageSrc" alt="Anatomy" class="anatomy-image" />

      <div
        *ngFor="let zone of currentTask.dropZones"
        class="image-drop-zone"
        cdkDropList
        [id]="zone.label"
        [cdkDropListConnectedTo]="['availableList']"
        (cdkDropListDropped)="dropOnImage($event, zone.label)"
        [style.top.%]="zone.top"
        [style.left.%]="zone.left"
      >
        <span class="placeholder-msg" *ngIf="!droppedItems[zone.label]">Húzd ide...</span>
        <div class="dropped-item" *ngIf="droppedItems[zone.label]">
          {{ droppedItems[zone.label] }}
        </div>
      </div>
    </div>
  </div>

  <div class="drag-drop-container" *ngIf="currentTask.type === 'list-to-list'">
    <div class="list-container">
      <div
        cdkDropList
        #sourceList="cdkDropList"
        [cdkDropListData]="availableOptions"
        [cdkDropListConnectedTo]="[destList]"
        class="item-list"
        (cdkDropListDropped)="drop($event)"
      >
        <div class="item-box" *ngFor="let item of availableOptions" cdkDrag>{{ item }}</div>
      </div>
    </div>

    <div class="list-container">
      <div
        cdkDropList
        #destList="cdkDropList"
        [cdkDropListData]="selectedOptions"
        [cdkDropListConnectedTo]="[sourceList]"
        class="item-list drop-zone"
        (cdkDropListDropped)="drop($event)"
      >
        <div class="empty-msg" *ngIf="selectedOptions.length === 0">Húzd ide...</div>
        <div class="item-box selected" *ngFor="let item of selectedOptions" cdkDrag>{{ item }}</div>
      </div>
    </div>
  </div>

  <footer class="action-footer">
    <button
      class="submit-btn"
      (click)="submitTask()"
      [disabled]="
        currentTask.type === 'list-to-image'
          ? getDroppedItemsCount() !== currentTask.requiredCount
          : selectedOptions.length !== currentTask.requiredCount
      "
    >
      Ellenőrzés ✅
    </button>
  </footer>
</div>
